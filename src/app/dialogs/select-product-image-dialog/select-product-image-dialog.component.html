<h2 mat-dialog-title>Product Images</h2>
<mat-dialog-content class="mat-typography">
  <app-file-upload [options]="options"></app-file-upload>




  <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px;">
    <mat-card class="product-image-card" *ngFor="let image of images" style="width: 200px; display: flex; flex-direction: column;">
      <div style="padding: 10px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; border-radius: 4px 4px 0 0;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: #475569; margin: 0;">
          <input type="radio" name="showcaseImg" [checked]="image.showcase" (change)="showCase(image.id)" style="width: 16px; height: 16px; cursor: pointer;" />
          Vitrin Resmi Yap
        </label>
      </div>
      <img mat-card-image [src]="image.path" style="object-fit: cover; height: 180px; width: 100%; margin: 0;">
      <mat-card-actions style="display: flex; justify-content: center; padding: 10px;">
        <button mat-button color="warn" (click)="deleteImage(image.id, $event)">SİL</button>
      </mat-card-actions>
    </mat-card>
  </div>





</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
