<section class="products-page">
  <!-- Sort Bar -->
  <div class="sort-bar">
    <div class="sort-bar-left">
      <button class="filter-toggle-btn" (click)="toggleSidebar()">
        <i class="fa-solid fa-sliders"></i>
        Filtrele
      </button>
      <span class="result-count" *ngIf="totalProductCount">{{ totalProductCount }} ürün</span>
    </div>
    <div class="sort-bar-right">
      <span class="sort-label">Sıralama:</span>
      <div class="sort-select-wrapper">
        <select class="sort-select" [value]="selectedSortType" (change)="onSortChange($any($event.target).value)">
          <option *ngFor="let opt of sortOptions" [value]="opt.value">{{ opt.label }}</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Active Filters -->
  <div class="active-filters" *ngIf="hasActiveFilters">
    <span class="active-filter-chip" *ngIf="selectedCategoryId" (click)="onCategorySelect('')">
      {{ getCategoryName(selectedCategoryId) }}
      <i class="fa-solid fa-xmark"></i>
    </span>
    <span class="active-filter-chip" *ngIf="selectedSortType" (click)="onSortChange('')">
      <ng-container *ngFor="let opt of sortOptions">
        <ng-container *ngIf="opt.value === selectedSortType">{{ opt.label }}</ng-container>
      </ng-container>
      <i class="fa-solid fa-xmark"></i>
    </span>
    <button class="clear-all-btn" (click)="clearFilters()">Temizle</button>
  </div>

  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" [class.open]="sidebarOpen" (click)="toggleSidebar()"></div>

  <div class="products-layout">
    <!-- Filter Sidebar -->
    <aside class="filter-sidebar" [class.open]="sidebarOpen">
      <div class="sidebar-header-mobile">
        <h3>Filtreler</h3>
        <button class="sidebar-close-btn" (click)="toggleSidebar()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Categories in Sidebar (New DefenceDB Mockup Style) -->
      <div class="filter-section ddb-category-sidebar">
        <h3 class="sidebar-cat-title">
          <i class="fa-solid fa-table-cells-large"></i> Tüm Kategoriler
        </h3>

        <ul class="ddb-sidebar-list">
          <li class="ddb-sidebar-item" [class.active]="selectedCategoryId === ''">
            <a (click)="onCategorySelect('')">
              <i class="fa-solid fa-list-ul"></i> Tüm Ürünler
            </a>
            <!-- <span class="badge" *ngIf="totalProductCount">{{ totalProductCount }}</span> -->
          </li>

          <ng-container *ngFor="let root of categoryTree">
            <li class="ddb-sidebar-item root-item" [class.active]="selectedCategoryId === root.id || isParentOfSelected(root)">
              <a (click)="onCategorySelect(root.id)">
                {{ root.name }}
              </a>

              <!-- Subcategories (only show if selected or parent of selected) -->
              <ul class="ddb-sidebar-sublist" *ngIf="root.children?.length && (selectedCategoryId === root.id || isParentOfSelected(root))">
                <li class="ddb-sidebar-subitem" *ngFor="let child of root.children" [class.active]="selectedCategoryId === child.id || isParentOfSelected(child)">
                  <a (click)="onCategorySelect(child.id)">
                    {{ child.name }}
                  </a>

                  <!-- Third level -->
                  <ul class="ddb-sidebar-sublist level-3" *ngIf="child.children?.length && (selectedCategoryId === child.id || isParentOfSelected(child))">
                    <li class="ddb-sidebar-subitem" *ngFor="let subchild of child.children" [class.active]="selectedCategoryId === subchild.id">
                      <a (click)="onCategorySelect(subchild.id)">
                        {{ subchild.name }}
                      </a>
                    </li>
                  </ul>
                </li>
              </ul>
            </li>
          </ng-container>
        </ul>
      </div>

      <!-- Other Filters Placeholders (Altta filter kısmı olmalı dediği için) -->
      <div class="filter-section">
        <h4 class="filter-title">Fiyat Aralığı</h4>
        <div class="filter-placeholder">
          <input type="number" placeholder="En Az" class="price-input">
          <span>-</span>
          <input type="number" placeholder="En Çok" class="price-input">
          <button class="price-search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
      </div>

      <!-- Sort (mobile only) -->
      <div class="filter-section mobile-sort-section">
        <h4 class="filter-title">Sıralama</h4>
        <ul class="sort-list">
          <li *ngFor="let opt of sortOptions"
            class="sort-item"
            [class.active]="selectedSortType === opt.value"
            (click)="onSortChange(opt.value); toggleSidebar();">
            {{ opt.label }}
          </li>
        </ul>
      </div>
    </aside>

    <!-- Products -->
    <div class="products-main">
      <div class="products-grid" *ngIf="products?.length; else emptyState">
        <app-product-card
          *ngFor="let product of products"
          [product]="product"
          [baseUrl]="baseUrl?.url"
          variant="default"
          [showAddToCart]="true"
          [isFavorite]="isProductFavorite(product.id)"
          (addToCart)="addToBasket($event)"
          (toggleFavorite)="onToggleFavorite($event)">
        </app-product-card>
      </div>

      <ng-template #emptyState>
        <div class="empty-state">
          <i class="fa-solid fa-box-open empty-icon"></i>
          <p>Bu kriterlere uygun ürün bulunamadı.</p>
          <button class="clear-filters-btn" *ngIf="hasActiveFilters" (click)="clearFilters()">Filtreleri Temizle</button>
        </div>
      </ng-template>

      <nav class="pager" aria-label="Page navigation" *ngIf="totalPageCount > 1">
        <button type="button" class="pager-btn" [disabled]="currentPageNo <= 1" (click)="onPageChange(currentPageNo - 1)">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button type="button" *ngFor="let page of pageList"
          class="pager-num" [class.active]="page === currentPageNo"
          (click)="onPageChange(page)">
          {{ page }}
        </button>
        <button type="button" class="pager-btn" [disabled]="currentPageNo >= totalPageCount" (click)="onPageChange(currentPageNo + 1)">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </nav>
    </div>
  </div>
</section>
