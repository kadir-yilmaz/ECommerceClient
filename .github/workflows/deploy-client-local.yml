name: Deploy ECommerce Client (Local Dokploy - Cloud Build)

on:
  workflow_dispatch: # Adds the manual "Run workflow" button in GitHub Actions UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Replace API URL for Local Server
        run: |
          sed -i "s|https://kadir.tryasp.net/api|http://api.192.168.1.56.sslip.io/api|g" src/environments/environment.prod.ts
          sed -i "s|https://kadir.tryasp.net/|http://api.192.168.1.56.sslip.io/|g" src/environments/environment.prod.ts

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner and define Image Name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$OWNER/ecommerce-client" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Deployment via Webhook
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
